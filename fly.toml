# Placeholder app name. First real deploy: `fly launch` (do not invent a URL).
# One Machine on purpose: in-process approval Futures cannot cross replicas.

app = "knowledgehub-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "demo"
  DEMO_MODE = "true"
  WHISPER_ENABLED = "false"
  GROBID_ENABLED = "false"
  DEMO_UPLOADS = "false"
  STORAGE_DIR = "/data"
  FRONTEND_DIST = "/app/frontend/dist"
  CHAT_RATE_LIMIT_PER_HOUR = "30"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 40
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    path = "/api/readyz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "knowledgehub_data"
  destination = "/data"

[deploy]
  release_command = "alembic upgrade head"
